<!doctype html>

  ><style>
    body {
      font:
        15px/1.6 system-ui,
        'PingFang SC',
        'Microsoft YaHei',
        sans-serif;
      color: #294737;
      background: #f3f7f3;
      margin: 0;
      padding: 28px;
    }
    main {
      max-width: 1360px;
      margin: auto;
    }
    h1 {
      font-size: 26px;
    }
    h2 {
      font-size: 19px;
    }
    .shots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    section {
      margin: 28px 0;
    }
    figure {
      margin: 0;
      background: white;
      padding: 12px;
      border: 1px solid #dce6de;
      border-radius: 12px;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 650px;
      object-fit: contain;
      margin: auto;
    }
    figcaption {
      margin-top: 10px;
      text-align: center;
      color: #5c7465;
    }
    .wide {
      max-height: none;
    }
    a {
      color: inherit;
    }
    @media (max-width: 700px) {
      body {
        padding: 16px;
      }
      .shots {
        grid-template-columns: 1fr;
      }
    }
  </style>
